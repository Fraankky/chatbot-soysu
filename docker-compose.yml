services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: soysu-postgres
    environment:
      POSTGRES_USER: soysu
      POSTGRES_PASSWORD: soysu
      POSTGRES_DB: soysu
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soysu -d soysu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soysu-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redisdata:
